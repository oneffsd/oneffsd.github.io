<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="生生生生生存 - 整合包与客户端下载">
<meta name="theme-color" content="#4c8c2b">
<title>下载整合包 - 生生生生生存</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#4c8c2b;--accent:#8bc34a;--bg:#1e1e1e;--success:#2e7d32}
body{background:var(--bg);color:#fff;font-family:"PingFang SC","Microsoft Yahei",sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
header{padding:20px 0;text-align:center;background:linear-gradient(rgba(34,51,24,.6),rgba(0,0,0,.5))}
header a{color:var(--primary);text-decoration:none;font-size:clamp(1.6rem,4vw,2.2rem);font-weight:bold}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 15px}
.card{width:100%;max-width:520px;padding:30px 24px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;text-align:center}
.card h1{color:var(--primary);font-size:1.6rem;margin-bottom:8px}
.card p{color:rgba(255,255,255,.7);margin-bottom:18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;min-height:30px}
.tag{background:rgba(0,0,0,.25);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:14px}
.tag.warn{color:#ffb300;border:1px solid rgba(255,179,0,.45)}
/* 长文件名不撑破卡片 */
.tag,.more a,.hash{max-width:100%;word-break:break-all}
.btn{display:inline-block;background:var(--primary);color:#fff;border:none;padding:12px 28px;border-radius:6px;cursor:pointer;font-size:16px;font-family:inherit;text-decoration:none;transition:transform .2s,filter .2s;touch-action:manipulation}
.btn.big{display:block;width:100%;font-size:18px;padding:14px}
.btn.ghost{background:rgba(0,0,0,.3);font-size:14px;padding:8px 16px;margin-top:14px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(hover:hover){.btn:hover{filter:brightness(1.1);transform:translateY(-2px)}}
.btn:active{transform:scale(.97)}
.btn.success-state{background:var(--success)}
.hash{margin-top:12px;font-size:12px;font-family:monospace;color:rgba(255,255,255,.45);user-select:all}
.more{margin-top:14px;font-size:14px;color:rgba(255,255,255,.6)}
.more a{color:var(--accent);margin:0 6px;display:inline-block}
.changelog{margin-top:22px;text-align:left;font-size:14px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.2);border-radius:6px;padding:12px 16px}
.changelog strong{color:var(--accent);display:block;margin-bottom:6px;font-weight:600}
.changelog a{color:var(--accent)}
.log-body{white-space:pre-wrap;word-break:break-word}
.tips{margin-top:22px;text-align:left;font-size:14px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.2);border-radius:6px;padding:12px 16px}
.tips li{margin-left:18px}
.back{display:inline-block;margin-top:18px;color:var(--accent);font-size:14px}
footer{padding:20px 0;text-align:center;font-size:.9rem;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<header><a href="./">生生生生生存</a></header>

<main>
<div class="card">
<h1>下载整合包</h1>
<!-- 初始文案对"没有 JS"的用户也是实话，加载成功后才被版本名覆盖 -->
<p id="relName" aria-live="polite">点击下方按钮可直接前往 GitHub 下载</p>
<div class="tags" id="tags"></div>

<a class="btn big" id="dlBtn" href="https://github.com/oneffsd/oneffsd.github.io/releases/latest">前往 GitHub 下载最新版</a>
<button class="btn ghost" id="copyBtn" type="button">复制下载链接</button>
<div class="hash" id="hash" hidden></div>
<div class="more" id="more" hidden></div>

<div class="changelog" id="changelog" hidden></div>

<ul class="tips">
<li>页面会自动读取 GitHub 上的最新发布版本（含预发布版，会单独标注）</li>
<li>下载慢或打不开时，可复制链接用下载工具或浏览器新窗口打开</li>
<li>压缩包请先解压，不要直接在压缩包内运行</li>
</ul>
<a class="back" href="./">← 返回首页</a>
</div>
</main>

<footer>© 2026 生生生生生存 保留所有权利</footer>

<script>
// ===== 配置区 =====
const REPO = "oneffsd/oneffsd.github.io";
const PAGE = "https://github.com/" + REPO + "/releases/latest";
const API = "https://api.github.com/repos/" + REPO + "/releases";
const CACHE_KEY = "latestRel";
const CACHE_TTL = 30 * 60e3;   // 超过 30 分钟仍可兜底展示，但会标"可能已过期"
const LOG_MAX = 500;           // 更新说明在页面上最多显示多少字

const $ = id => document.getElementById(id);
const dlBtn = $("dlBtn"), copyBtn = $("copyBtn"), tags = $("tags"), more = $("more"), hash = $("hash");
let staleAt = 0;               // 当前展示数据的缓存时间，0 表示是刚拉到的

/* ===== 缓存（先秒开、再后台更新） ===== */
function readCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && c.d && typeof c.d === "object") return c;
  } catch (e) {}
  return null;
}
function writeCache(d) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), d })); } catch (e) {}
}

/* ===== 工具 ===== */
function addTag(text, cls) {
  if (!text) return;
  const s = document.createElement("span");
  s.className = cls ? "tag " + cls : "tag";
  s.textContent = text;
  tags.appendChild(s);
}
function fmtSize(b) {
  if (!isFinite(b) || b <= 0) return "";
  if (b >= 1073741824) return (b / 1073741824).toFixed(2) + " GB";
  if (b >= 1048576) return (b / 1048576).toFixed(2) + " MB";
  return Math.max(1, Math.round(b / 1024)) + " KB";
}
function fmtDate(s) {
  const d = new Date(s);
  return isNaN(d.getTime()) ? "" : d.toLocaleDateString("zh-CN");
}

/* ===== 渲染 ===== */
function render(rel) {
  if (!rel || typeof rel !== "object") return fail();
  // 先整体清空，保证"先缓存后刷新"两次调用也不会残留上一次的内容
  tags.textContent = "";
  more.textContent = ""; more.hidden = true;
  hash.textContent = ""; hash.hidden = true;
  $("changelog").textContent = ""; $("changelog").hidden = true;

  $("relName").textContent = rel.name || rel.tag_name || "最新版本";

  if (rel.tag_name) addTag("版本 " + rel.tag_name);
  if (rel.prerelease) addTag("预发布，可能不稳定", "warn");
  const d = fmtDate(rel.published_at);
  if (d) addTag(d + " 发布");

  const assets = (rel.assets || []).filter(a => a && a.browser_download_url);
  if (!assets.length) {
    // 没有上传附件时，引导到发布页
    dlBtn.href = rel.html_url || PAGE;
    dlBtn.textContent = "前往发布页下载";
  } else {
    const main = assets.find(a => /\.(zip|7z|rar|mrpack|jar)$/i.test(a.name)) || assets[0];
    dlBtn.href = main.browser_download_url;
    dlBtn.textContent = "⬇ 下载最新版整合包";
    addTag(main.name);
    addTag(fmtSize(main.size));

    // 有校验值时展示出来，方便玩家核对包有没有被中转环节改坏
    if (main.digest && /^sha256:/i.test(main.digest)) {
      const h = main.digest.replace(/^sha256:/i, "");
      hash.textContent = "SHA-256：" + h;
      hash.title = h;
      hash.hidden = false;
    }

    const others = assets.filter(a => a !== main);
    if (others.length) {
      more.hidden = false;
      more.appendChild(document.createTextNode("其他文件："));
      others.forEach(a => {
        const l = document.createElement("a");
        l.href = a.browser_download_url;
        l.textContent = a.name;
        // 新窗口打开：万一是个 .txt，也不会把用户顶出下载页
        l.target = "_blank";
        l.rel = "noopener noreferrer";
        more.appendChild(l);
      });
    }
  }
  renderChangelog(rel);
}

function renderChangelog(rel) {
  const body = (rel.body || "").trim();
  const box = $("changelog");
  box.textContent = ""; box.hidden = true;
  if (!body) return;
  const title = document.createElement("strong");
  title.textContent = "更新说明";
  const pre = document.createElement("div");
  pre.className = "log-body";
  // 必须用 textContent：发布说明是任意外部文本，用 innerHTML 等于让人家往你页面里塞脚本
  pre.textContent = body.length > LOG_MAX ? body.slice(0, LOG_MAX) + "…" : body;
  box.appendChild(title); box.appendChild(pre);
  if (body.length > LOG_MAX) {
    const a = document.createElement("a");
    a.href = rel.html_url || PAGE;
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "查看完整说明 →";
    box.appendChild(a);
  }
  box.hidden = false;
}

function fail() {
  $("relName").textContent = "暂时无法读取版本信息";
  tags.textContent = ""; more.hidden = true;
  dlBtn.textContent = "前往 GitHub 下载最新版";
  dlBtn.href = PAGE;
  staleAt = 0;
}

/* ===== 拉取 ===== */
async function load() {
  const c = readCache();
  if (c) { staleAt = c.t; render(c.d); }   // 先用缓存秒开
  try {
    // 用列表接口而不是 /releases/latest：latest 会跳过预发布版，
    // 勾了 "Set as a pre-release" 就会一直显示上一个正式版且毫无提示
    const res = await fetch(API + "?per_page=5", {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    });
    if (!res.ok) throw new Error("http " + res.status);
    const list = await res.json();
    const rel = Array.isArray(list) ? list.find(r => r && !r.draft) : null;
    if (!rel) throw new Error("no release");
    writeCache(rel);
    staleAt = 0;
    render(rel);
  } catch (e) {
    if (!c) return fail();
    // 有缓存就继续用缓存，不要把页面打回失败态；过期了给个提示
    if (staleAt && Date.now() - staleAt > CACHE_TTL) addTag("信息可能已过期", "warn");
  }
}
load();

/* ===== 复制当前下载链接 ===== */
let t;
function done(ok) {
  clearTimeout(t);
  copyBtn.textContent = ok ? "已复制！" : "复制失败，请手动复制";
  copyBtn.classList.toggle("success-state", ok);
  t = setTimeout(() => { copyBtn.textContent = "复制下载链接"; copyBtn.classList.remove("success-state"); }, 2000);
}
function fallback(url) {
  const ta = document.createElement("textarea");
  ta.value = url; ta.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); done(ok);
}
copyBtn.addEventListener("click", () => {
  const url = dlBtn.href;
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(url).then(() => done(true), () => fallback(url));
  else fallback(url);
});
</script>
</body>
</html>
