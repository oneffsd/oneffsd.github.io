<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>生生生生生存</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing:border-box;
            -webkit-tap-highlight-color:transparent;
        }
        :root {
            --primary: #4c8c2b;
            --secondary: #386c20;
            --accent: #8bc34a;
            --bg: #1e1e1e;
            --text: #fff;
            --success: #2e7d32;
        }
        body {
            background:var(--bg);
            color:var(--text);
            font-family:"Microsoft Yahei",sans-serif;
            line-height:1.6;
            font-size:16px;
        }
        .container {max-width:1200px;margin:0 auto;padding:0 15px;}
        header {padding:20px 0;text-align:center;background:rgba(0,0,0,0.5);position:relative;}
        header::before {content:"";position:absolute;inset:0;background:#223318;opacity:0.4;z-index:-1;}
        .server-title {font-size:clamp(2rem,5vw,3rem);margin-bottom:10px;color:var(--primary);animation:breath 3s ease-in-out infinite;}
        @keyframes breath {0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
        .server-subtitle {padding:12px 20px;margin:0 auto 20px;background:rgba(0,0,0,0.3);border-radius:5px;display:inline-block;}
        
        .banner {padding:30px 0;text-align:center;}
        .server-addr {margin:20px auto;padding:10px 15px;background:rgba(0,0,0,0.3);border-radius:4px;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;}
        .addr-text {color:var(--accent);font-size:1.1rem;font-family:monospace;}

        .copy-btn,.refresh-btn {
            background:var(--primary);
            color:#fff;
            border:none;
            padding:7px 14px;
            border-radius:4px;
            cursor:pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size:15px;
            min-width: 100px;
        }
        
        .copy-btn.success-state {
            background: var(--success) !important;
            transform: scale(1.05);
        }

        .copy-btn:active,.refresh-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .info-row {display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0;}
        .info-tag {background:rgba(0,0,0,0.2);color:var(--accent);padding:5px 12px;border-radius:20px;font-weight:bold;font-size:15px;}
        .online {color:#4CAF50;border:1px solid #4CAF50;}
        .offline {color:#f44336;border:1px solid #f44336;}
        .unknown {color:#ff9800;border:1px solid #ff9800;}
        
        .desc-box {max-width:600px;margin:25px auto;padding:18px;background:rgba(0,0,0,0.3);border-radius:4px;}
        .desc-box h3 {color:var(--accent);margin-bottom:8px;}

        .scroll-item {
            opacity: 0;
            transform: translateY(20px);
            transition: 
                transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
                opacity 0.6s ease-out, 
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }
        .scroll-item.animate {
            opacity: 1;
            transform: translateY(0);
        }
        .feat-card.scroll-item.animate:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            border-color: var(--primary);
        }
        .rule-card.scroll-item.animate:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .card-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:30px;}
        .feat-card {
            padding:18px;text-align:center;background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor: pointer;
        }
        .rule-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
        .rule-card {
            display:flex;gap:12px;padding:18px;background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.1);border-radius:8px;cursor: pointer;
        }
        .rule-num {width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;}
        footer {padding:25px 0;text-align:center;font-size:0.9rem;color:rgba(255,255,255,0.5);}
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 class="server-title">生生生生生存</h1>
        <p class="server-subtitle">原版生存这一块，原汁原味这一块</p>
    </div>
</header>

<section class="banner">
    <div class="container">
        <div class="server-addr">
            <span class="addr-text" id="ipAddr">114.66.23.27:6031</span>
            <button class="copy-btn" id="copyBtn" onclick="copyTxt(this,'114.66.23.27:6031')">复制地址</button>
            <button class="refresh-btn" onclick="checkServer(this)">刷新状态</button>
        </div>
        <div class="info-row">
            <div class="info-tag">版本：26.1.2</div>
            <div class="info-tag" id="playerNum">在线：--</div>
            <div class="info-tag" id="serverStat">状态：获取中</div>
        </div>
    </div>
</section>

<section class="feature-wrap" style="padding:40px 0; background:rgba(0,0,0,0.1);">
    <div class="container">
        <div class="card-grid">
            <div class="feat-card scroll-item">🏠<h3 style="color:var(--primary)">和睦社群</h3><p>氛围融洽的MC玩家聚集地</p></div>
            <div class="feat-card scroll-item">🛡️<h3 style="color:var(--primary)">专人管理</h3><p>管理员在线维护公平游玩</p></div>
            <div class="feat-card scroll-item">🚀<h3 style="color:var(--primary)">稳定更新</h3><p>紧跟版本内容持续优化</p></div>
            <div class="feat-card scroll-item">🌐<h3 style="color:var(--primary)">低延迟</h3><p>流畅游戏极少卡顿</p></div>
        </div>
    </div>
</section>

<section class="rule-wrap" style="padding:40px 0;">
    <div class="container">
        <h2 style="text-align:center; margin-bottom:20px; color:var(--primary)" class="scroll-item">服务器守则</h2>
        <div class="rule-grid">
            <div class="rule-card scroll-item"><span class="rule-num">1</span><div><h3>守则一</h3><p>远离无名玩家及异常区域。</p></div></div>
            <div class="rule-card scroll-item"><span class="rule-num">2</span><div><h3>守则二</h3><p>听见脚步不见人即刻进屋。</p></div></div>
            <div class="rule-card scroll-item"><span class="rule-num">3</span><div><h3>守则三</h3><p>天色异常漆黑时停止外出。</p></div></div>
            <div class="rule-card scroll-item"><span class="rule-num">4</span><div><h3>守则四</h3><p>出现同名玩家即刻下线。</p></div></div>
        </div>
    </div>
</section>

<footer><div class="container">© 2026 生生生生生存 保留所有权利</div></footer>

<script>
let copyTimer = null;

function copyTxt(btn, text) {
    if (copyTimer) clearTimeout(copyTimer);
    const originalText = "复制地址";
    const doCopy = () => {
        btn.innerText = "复制成功！";
        btn.classList.add('success-state');
        copyTimer = setTimeout(() => {
            btn.innerText = originalText;
            btn.classList.remove('success-state');
            copyTimer = null;
        }, 2000);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(doCopy).catch(() => fallbackCopy(text, doCopy));
    } else {
        fallbackCopy(text, doCopy);
    }
}

function fallbackCopy(text, callback) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    try {
        document.execCommand('copy');
        callback();
    } catch (err) {}
    document.body.removeChild(textArea);
}

var ip = "114.66.23.27", port = 6031;

function checkServer(btn){
    const statDom = document.getElementById("serverStat");
    const playerDom = document.getElementById("playerNum");
    statDom.innerText = "刷新中...";
    fetch(`https://api.mcstatus.io/v2/status/java/${ip}:${port}`)
        .then(res => res.json())
        .then(d => {
            if(d.online){
                playerDom.innerText = `在线：${d.players.online}/${d.players.max}`;
                statDom.innerText = "状态：正常";
                statDom.className = "info-tag online";
            } else {
                statDom.innerText = "状态：离线";
                statDom.className = "info-tag offline";
            }
        }).catch(() => {
            statDom.innerText = "状态：超时";
            statDom.className = "info-tag unknown";
        });
}

window.addEventListener('load', () => {
    setTimeout(checkServer, 500);
    setInterval(checkServer, 35000);
});

const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add("animate");
            obs.unobserve(entry.target);
        }
    });
}, { threshold: 0.1 });

document.querySelectorAll(".scroll-item").forEach(item => obs.observe(item));
</script>
</body>
</html>
